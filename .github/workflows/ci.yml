name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khzenty
        ports:
          - 5432:5432
        # Without the health check, steps can start before Postgres accepts
        # connections and the suite fails on a race rather than a real bug.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The service container publishes 5432; compose.yaml uses 5433 locally.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khzenty?schema=public
      # The suite creates this database itself and refuses any name not ending
      # in "_test", since it truncates every table.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khzenty_test?schema=public
      # Throwaway value: the env schema requires 32+ characters.
      JWT_SECRET: ci-only-secret-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      # `npm ci` rather than `npm install`, so a drifted lockfile fails the
      # build instead of being silently updated. Three packages, so three runs.
      - name: Install (root)
        run: npm ci
      - name: Install (server)
        run: npm ci
        working-directory: server
      - name: Install (client)
        run: npm ci
        working-directory: client

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
